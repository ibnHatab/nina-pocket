# Nina Pocket's APKs, both variants: arm32 (Android 7.1+, the Fire 7) and arm64 (Android 8+, newer phones).
# The code is in four public repos beside this one (build.sh's REPO_ROOT layout); their refs are inputs.
# Signing: the secret KEYSTORE_B64 (a base64 keystore; KEYSTORE_PASS, KEY_ALIAS) when set, so an update
# installs over the last one; otherwise a throwaway key for this run (uninstall before installing).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fsttm_ref: {description: fsttm-live ref, default: proof/android}
      nina_ref: {description: nina-live ref, default: proof/android}
      acasa_ref: {description: acasa ref, default: fix/old-webview}
      metis_ref: {description: metis-lang ref, default: master}
      narratives_ref: {description: nina-narratives ref (her rules, catalog/domains), default: main}

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [arm32, arm64]
    env:
      FSTTM_REF: ${{ inputs.fsttm_ref || 'proof/android' }}
      NINA_REF: ${{ inputs.nina_ref || 'proof/android' }}
      ACASA_REF: ${{ inputs.acasa_ref || 'fix/old-webview' }}
      METIS_REF: ${{ inputs.metis_ref || 'master' }}
    steps:
      - uses: actions/checkout@v5
        with: {path: nina-pocket, fetch-depth: 0}
      - name: the code beside it
        run: |
          git clone -q --depth 1 -b "$FSTTM_REF" https://github.com/ibnHatab/fsttm-live.git fsttm-live
          git clone -q --depth 1 -b "$NINA_REF" https://github.com/ibnHatab/nina-live.git nina-live
          git clone -q --depth 1 -b "$ACASA_REF" https://github.com/ibnHatab/acasa.git acasa
          git clone -q --depth 1 -b "$METIS_REF" https://github.com/metis-lang-dev/metis-lang.git perotheia-packages/metis-lang
          git clone -q --depth 1 -b "${{ inputs.narratives_ref || 'main' }}" https://github.com/ibnHatab/nina-narratives.git nina-narratives   # nina-live's catalog/domains links here
          for d in fsttm-live nina-live acasa perotheia-packages/metis-lang nina-narratives; do echo "$d $(git -C $d log --oneline -1)"; done
      - uses: actions/setup-go@v6
        with: {go-version: '1.26', cache: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Android SDK pieces, OCaml (metisc), gomobile
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ocaml zip   # ocamlopt (ocaml-nox is gone from newer Ubuntu)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" "platforms;android-36" "ndk;27.0.12077973" > /dev/null
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261117202452-47699113848a
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261117202452-47699113848a
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            { echo "KEYSTORE=$RUNNER_TEMP/release.keystore"; echo "KEYSTORE_PASS=$KEYSTORE_PASS_SECRET"; echo "KEY_ALIAS=$KEY_ALIAS_SECRET"; } >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::a release needs the signing secrets (scripts/make-signing-key.sh)"; exit 1
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.keystore" -storepass android -keypass android \
              -alias throwaway -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Nina Pocket CI" > /dev/null
            { echo "KEYSTORE=$RUNNER_TEMP/throwaway.keystore"; echo "KEYSTORE_PASS=android"; echo "KEY_ALIAS=throwaway"; } >> "$GITHUB_ENV"
            echo "::warning::no KEYSTORE_B64 secret: signed with a throwaway key (uninstall the app before installing this build)"
          fi
      - name: build ${{ matrix.variant }}
        working-directory: nina-pocket
        run: ./build.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v5
        with:
          name: nina-pocket-${{ matrix.variant }}
          path: nina-pocket/out/nina-pocket-${{ matrix.variant }}.apk

  release: # a tag v*: both APKs on a GitHub release (signed with the release key: updates install over it)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with: {path: apks, merge-multiple: true}
      - name: release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la apks
          gh release create "${GITHUB_REF_NAME}" apks/nina-pocket-arm32.apk apks/nina-pocket-arm64.apk \
            --repo "$GITHUB_REPOSITORY" --title "Nina Pocket ${GITHUB_REF_NAME}" --generate-notes \
            --notes "arm32: Android 7.1+ (32-bit ARM, e.g. the Fire 7). arm64: Android 8+ (64-bit ARM phones). Her Gemini key is asked on the first start."

